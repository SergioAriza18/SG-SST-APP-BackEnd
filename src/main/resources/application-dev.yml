spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sgsst_bd?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
    username: sgsst_user
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Bogota

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}
